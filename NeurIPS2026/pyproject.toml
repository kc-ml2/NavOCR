[project]
name = "navocr-bench"
version = "0.1.0"
description = "OCR-then-LLM baseline for navigation-relevant text extraction"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = []

[project.optional-dependencies]
ocr = [
  "paddlepaddle-gpu==3.2.1",
  "paddleocr==3.7.0",
  "numpy<2.0",
  "opencv-python<=4.6.0",
  "textdistance",
  "pycocotools",
  "imgaug>=0.4.0",
  "setuptools<81",
  "PyYAML",
  "scipy",
  "scikit-learn",
  "shapely",
  "terminaltables",
  "tqdm",
  "typeguard",
  "visualdl",
]
llm = ["torch==2.13.0", "transformers==5.14.1", "accelerate", "pillow", "textdistance", "pycocotools"]

[tool.setuptools.packages.find]
include = ["navocr_bench*"]
