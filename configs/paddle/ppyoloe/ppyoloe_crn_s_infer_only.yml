_BASE_: [
  '../datasets/coco_detection.yml',
  '../runtime.yml',
  './_base_/optimizer_300e.yml',
  './_base_/ppyoloe_crn.yml',
  './_base_/ppyoloe_reader.yml',
]

log_iter: 100
snapshot_epoch: 10
weights: model/paddle/navocr.pdparams

depth_mult: 0.33
width_mult: 0.50

# ====== My dataset override ======
num_classes: 2

TestDataset:
  dataset_dir: configs/paddle/datasets/metadata
  anno_path: annotations/instances_test.json

TestReader:
  sample_transforms:
    - Decode: {}
    - Resize:
        target_size: [640, 640]
        keep_ratio: true
        interp: 2
    - Pad:
        size: [640, 640]
        pad_mode: 0
        fill_value: [123.675, 116.28, 103.53]
    - NormalizeImage:
        mean: [0.485, 0.456, 0.406]
        std: [0.229, 0.224, 0.225]
        is_scale: true
    - Permute: {}
  batch_size: 1
  use_shared_memory: false

PPYOLOEHead:
  nms:
    name: MultiClassNMS
    nms_top_k: 1000
    keep_top_k: 300
    score_threshold: 0.01
    nms_threshold: 0.7
